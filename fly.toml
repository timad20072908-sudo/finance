# fly.toml app configuration file generated for finance-hdmbtg on 2026-05-28T19:45:04Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'finance-hdmbtg'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  DB_PATH = '/data/app.db'
  NODE_ENV = 'production'
  PORT = '8080'

[[mounts]]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
